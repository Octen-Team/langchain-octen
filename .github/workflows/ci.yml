name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install "poetry==2.3.3"
      - name: Install dependencies
        run: poetry install --with test
      - name: Run unit tests
        run: poetry run pytest tests/unit_tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install "poetry==2.3.3"
      - name: Install dependencies
        run: poetry install --with test,dev
      - name: Ruff
        run: poetry run ruff check langchain_octen tests
      - name: Mypy
        run: poetry run mypy langchain_octen
