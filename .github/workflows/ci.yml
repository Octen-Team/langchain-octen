name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # Poetry 2.3 needs Python >= 3.10, so it gets its own interpreter.
      - uses: actions/setup-python@v5
        id: poetry-python
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install --python "${{ steps.poetry-python.outputs.python-path }}" "poetry==2.3.3"
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry install --with test
      - name: Check the test environment's Python version
        run: poetry run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}.'), sys.version"
      - name: Run unit tests
        run: poetry run pytest tests/unit_tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install --python "${{ steps.python.outputs.python-path }}" "poetry==2.3.3"
      - name: Install dependencies
        run: |
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry install --with test,dev
      - name: Ruff
        run: poetry run ruff check langchain_octen tests
      - name: Mypy
        run: poetry run mypy langchain_octen
